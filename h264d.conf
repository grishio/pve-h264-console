# SPDX-License-Identifier: MIT
# /etc/pve-h264/h264d.conf - defaults for pve-h264d (one daemon per VM)
# Viewers can change nvenc_preset and everything from "encoding" to refine_frames
# at runtime from the viewer's Stream settings panel (shared by all viewers
# of the VM, until the daemon exits).

# encoder backend: auto (nvenc -> vaapi -> x264) | nvenc | vaapi | x264
backend = auto
# preset p1 (fastest) .. p7 (best compression). NVENC at 1080p on a mid-range NVIDIA GPU:
# p2 ~3.5 ms, p4 ~5 ms, p6 ~8 ms per frame. x264: p1/p2 = ultrafast .. p7 = medium
nvenc_preset = p4
# NVENC GPU index (if several NVIDIA GPUs)
gpu = 0
# VA-API render node for Intel/AMD (empty = probe /dev/dri/renderD128..135)
vaapi_device =

# --- encoding ---
# rate control: vbr (quality-targeted, capped by max_kbps) | cbr | cqp
rc = vbr
# NVENC tuning: ull | ll | hq (all with zero frame delay: no B-frames, no lookahead)
tune = ull
# NVENC first pass per frame: disabled | qres | fullres (better bit allocation)
multipass = disabled
# adaptive quantization (NVENC; x264: spatial only). aq_strength 1..15
spatial_aq = 0
aq_strength = 8
temporal_aq = 0

# frame rate ceiling (frames are only encoded when the screen changes)
fps = 60
# VBR ceiling (CBR: the rate) in kbit/s; adaptive control moves between
# min_kbps and this when the network queues (abr = 0: fixed at max_kbps)
max_kbps = 25000
min_kbps = 1500
abr = 1
# target quality (cq / crf / qvbr), lower = better. 18 high .. 32 low
quality = 24
# VBV buffer at max rate, in frames (smaller = tighter latency, more quality swing)
vbv_frames = 6
# frames sent but not yet decoded by a viewer before we pause encoding;
# 0 = auto (covers the measured round trip: 2 on a LAN, 4-6 over WAN/VPN)
max_inflight = 0
# extra frames encoded after the screen goes static, to sharpen it
refine_frames = 4
# daemon exits after this many seconds without viewers
idle_exit_s = 30
# Windows guests (virtio-gpu): apply "Resize guest" through qemu-guest-agent.
# Starts a small PowerShell listener in the logged-in user's session (via a
# hidden scheduled task, exits after 30 min idle) that calls SetDisplayConfig;
# requests go through C:\ProgramData\pve-h264\. 0 = off.
guest_exec_resize = 1
# Guest audio to the viewer (Opus, lip-synced with the video). Read by the
# patched qemu-server when a VM starts: the VM's audio0 device (driver spice)
# is moved to QEMU's D-Bus audio backend. 0 = leave audio on SPICE.
audio = 1

# Clipboard sharing (text) between the viewer's browser and the guest, through
# the spice agent in the guest (spice-vdagent / virtio-win guest tools):
# both | to-guest (browser -> guest only) | from-guest (guest -> browser only) | off
clipboard = both
